name: Build gd-edit executable

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full git history — build.clj uses git-count-revs/git describe for versioning

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest

      - name: Install launch4j
        run: sudo apt-get update && sudo apt-get install -y launch4j

      - name: Build
        run: clojure -T:build build

      - uses: actions/upload-artifact@v4
        with:
          name: gd-edit-build
          path: |
            target/*.exe
            target/gd-edit
